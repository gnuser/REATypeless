name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-native.sh
      - run: sh scripts/build-native.sh
